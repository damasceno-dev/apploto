<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LottoGest Backend Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1e1e1c;--box:#2a2a28;--border:#555;--text:#e8e6df;
  --accent:#e67e22;--dim:#9c9a92;--panel:#252523;--nav-h:56px;
  --blue:#4a9eff;--green:#4caf50;--amber:#e67e22;--purple:#9c27b0;--teal:#26a69a;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif}

.slides{display:flex;width:100%;height:calc(100vh - var(--nav-h));overflow:hidden}
.slides-track{display:flex;transition:transform .5s cubic-bezier(.4,0,.2,1);will-change:transform}
.slide{min-width:100vw;width:100vw;height:calc(100vh - var(--nav-h));padding:28px 48px 12px;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:rgba(30,30,28,.96);backdrop-filter:blur(10px);border-top:1px solid #333;display:flex;align-items:center;justify-content:center;gap:16px;z-index:100}
.nav-btn{background:var(--box);border:1px solid var(--border);color:var(--text);padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:all .2s;user-select:none}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn:active{transform:scale(.96)}
.slide-dots{display:flex;gap:8px;align-items:center}
.slide-dot{width:10px;height:10px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .3s;border:none}
.slide-dot.active{background:var(--accent);transform:scale(1.3);box-shadow:0 0 8px rgba(230,126,34,.4)}
.slide-dot:hover{background:#888}

.title-slide{justify-content:center;align-items:center;text-align:center}
.title-slide h1{font-size:clamp(32px,5vw,52px);font-weight:700;letter-spacing:-.02em;margin-bottom:16px;background:linear-gradient(135deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.title-slide .subtitle{font-size:clamp(14px,1.8vw,18px);color:var(--dim);max-width:680px;line-height:1.7;margin-bottom:36px}
.title-slide .bullets{list-style:none;display:flex;flex-direction:column;gap:12px}
.title-slide .bullets li{font-size:16px;color:var(--dim);letter-spacing:.01em}
.title-slide .bullets li::before{content:'▸ ';color:var(--accent);font-weight:600}

.schema-slide{justify-content:flex-start;align-items:center;padding-top:36px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.schema-slide h2{font-size:clamp(24px,3.5vw,34px);font-weight:600;margin-bottom:28px}
.schema-groups{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;max-width:1100px}
.schema-group{background:var(--box);border:1px solid var(--border);border-radius:12px;padding:16px 20px;min-width:185px;flex:0 1 200px;transition:transform .2s}
.schema-group:hover{transform:translateY(-2px)}
.schema-group h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid}
.schema-group .entity{font-size:13px;color:var(--dim);padding:3px 0;padding-left:8px;border-left:2px solid transparent}
.schema-group .entity:hover{color:var(--text);border-left-color:inherit}

.closing-slide{justify-content:center;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.closing-slide h2{font-size:clamp(26px,4vw,38px);font-weight:600;margin-bottom:36px;text-align:center}
.closing-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:920px;width:100%}
.closing-card{background:var(--box);border:1px solid var(--border);border-radius:12px;padding:24px 28px;transition:all .3s}
.closing-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.closing-card h3{color:var(--accent);font-size:17px;font-weight:600;margin-bottom:10px}
.closing-card p{color:var(--dim);font-size:14px;line-height:1.6}

.intro-slide{justify-content:flex-start;align-items:center;padding:40px 60px;overflow-y:auto}
.intro-slide h2{font-size:clamp(24px,3.5vw,36px);font-weight:600;margin-bottom:8px;text-align:center}
.intro-slide .intro-sub{font-size:15px;color:var(--dim);text-align:center;margin-bottom:32px;font-style:italic}
.intro-cols{display:flex;gap:28px;max-width:1100px;width:100%;align-items:flex-start}
.intro-cols.stacked{flex-direction:column;align-items:center}
.intro-col{flex:1;min-width:0}
.intro-text{font-size:15px;line-height:1.8;color:#bbb;margin-bottom:16px}
.intro-text b{color:var(--text);font-weight:600}
.intro-text em{color:var(--accent);font-style:normal;font-weight:500}
.intro-card{background:var(--box);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px;transition:all .3s}
.intro-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.intro-card h3{font-size:16px;font-weight:600;margin-bottom:8px}
.intro-card h3.in-color{color:#4caf50}
.intro-card h3.out-color{color:#ef5350}
.intro-card h3.accent-color{color:var(--accent)}
.intro-card h3.blue-color{color:var(--blue)}
.intro-card h3.teal-color{color:var(--teal)}
.intro-card p{color:var(--dim);font-size:14px;line-height:1.65}
.intro-card code{background:#333;padding:2px 6px;border-radius:3px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--accent)}
.intro-card .mini-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
.intro-card .mini-table th{text-align:left;color:var(--accent);font-weight:500;padding:4px 8px;border-bottom:1px solid #444}
.intro-card .mini-table td{padding:4px 8px;color:var(--dim);border-bottom:1px solid #333}
.intro-highlight{border-left:3px solid var(--accent);padding-left:16px;margin:16px 0;font-size:14px;color:var(--dim);line-height:1.7}
.intro-highlight b{color:var(--accent)}
.intro-tree{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);line-height:1.8;background:var(--panel);padding:14px 18px;border-radius:8px;border:1px solid #333}
.intro-tree b{color:var(--text);font-weight:500}
.intro-tree .hl{color:var(--accent)}

.uc-slide{overflow-y:hidden}
.uc-slide .uc-header{flex-shrink:0;margin-bottom:8px;display:flex;align-items:baseline;justify-content:space-between}
.uc-slide .uc-header h2{font-size:22px;font-weight:600}
.uc-slide .step-info{font-size:13px;color:var(--dim)}
.uc-slide .step-info .step-title{color:var(--accent);font-weight:500}

.uc-content{flex:1;display:flex;gap:20px;overflow:hidden;min-height:0}
.uc-diagram{flex:0 0 50%;display:flex;align-items:center;justify-content:center;min-width:0}
.uc-diagram svg{width:100%;height:100%;max-height:100%}

.uc-panel{flex:1;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-width:0}
.uc-narrative{font-size:14.5px;line-height:1.7;color:#bbb;overflow-y:auto;flex:1 1 50%;padding-right:8px;transition:opacity .25s}
.uc-narrative::-webkit-scrollbar{width:4px}
.uc-narrative::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
.uc-data{background:var(--panel);border:1px solid #333;border-radius:8px;padding:12px 16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;overflow-y:auto;flex:1 1 50%;transition:opacity .25s}
.uc-data::-webkit-scrollbar{width:4px}
.uc-data::-webkit-scrollbar-thumb{background:#444;border-radius:2px}

.data-entry{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #333}
.data-entry:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.data-entity-name{color:var(--accent);font-weight:500;margin-bottom:5px;font-size:12px}
.data-row{display:flex;gap:6px;padding:2px 0;flex-wrap:wrap}
.data-row .fn{color:#666;min-width:100px;flex-shrink:0}
.data-row .fv{color:var(--text);word-break:break-all}
.data-row .fv.hl{color:var(--accent);font-weight:600}
.data-row .fv.hl-green{color:#4caf50;font-weight:600}
.data-row .fv.hl-blue{color:var(--blue);font-weight:600}
.data-row .fv.hl-red{color:#ef5350;font-weight:600}
.data-sql{color:#bbb;line-height:1.6;white-space:pre-wrap;font-size:11px}
.data-sql .kw{color:var(--blue)}
.data-sql .res{color:var(--accent);font-weight:600}

.step-controls{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0}
.step-btn{background:var(--box);border:1px solid var(--border);color:var(--text);padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .2s;user-select:none}
.step-btn:hover{border-color:var(--accent);color:var(--accent)}
.step-dots{display:flex;gap:6px;align-items:center}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s}
.step-dot.active{background:var(--accent);box-shadow:0 0 6px rgba(230,126,34,.4)}
.play-btn.playing{background:var(--accent)!important;color:var(--bg)!important;border-color:var(--accent)!important}

.tbl-box rect{fill:var(--box);stroke:var(--border);stroke-width:1.5;transition:all .4s}
.tbl-box text{fill:var(--text);font-family:'Inter',sans-serif;font-size:12px;font-weight:500;transition:fill .4s}
.tbl-box.active rect{stroke:var(--accent);stroke-width:2.5;filter:drop-shadow(0 0 10px rgba(230,126,34,.25))}
.tbl-box.active text{fill:var(--accent)}
.tbl-box.dimmed{opacity:.25;transition:opacity .5s}
.tbl-box .badge{font-size:10px;fill:var(--accent);font-weight:600}
.tbl-box .badge-bg{fill:#3a2a10;stroke:var(--accent);stroke-width:1;rx:4}

.arrow-path{fill:none;stroke:var(--dim);stroke-width:1.5;marker-end:url(#ah);transition:stroke .4s,opacity .4s,stroke-width .3s}
.arrow-path.active{stroke:var(--accent);stroke-width:2;marker-end:url(#ah-a)}
.arrow-path.dimmed{opacity:.15}
.arrow-path.hidden{opacity:0;pointer-events:none}

@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease both}

.nav-btn.faded{opacity:.25;pointer-events:none}
.restart-btn{margin-top:32px;background:var(--accent);border:none;color:var(--bg);padding:14px 36px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:600;font-family:inherit;transition:all .2s;letter-spacing:.01em}
.restart-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(230,126,34,.35)}
.restart-btn:active{transform:scale(.97)}

@media(max-width:1024px){
  .slide{padding:20px 28px 10px}
  .intro-slide{padding:24px 28px}
  .title-slide h1{font-size:28px}
  .title-slide .subtitle{font-size:14px}
  .intro-cols{flex-direction:column}
  .uc-content{flex-direction:column}
  .uc-diagram{flex:0 0 auto;height:36vh;min-height:200px}
  .uc-panel{flex:1;min-height:0}
  .uc-narrative{font-size:13px;flex:1 1 45%}
  .uc-data{font-size:10.5px;flex:1 1 55%}
  .closing-cards{grid-template-columns:1fr}
  .schema-groups{gap:10px}
  .schema-group{min-width:140px;padding:12px 14px}
  .intro-card p{font-size:13px}
  .intro-text{font-size:14px}
  .intro-tree{font-size:10px;overflow-x:auto}
}
@media(max-width:680px){
  :root{--nav-h:48px}
  .slide{padding:12px 14px 8px}
  .intro-slide{padding:14px 14px}
  .title-slide h1{font-size:22px}
  .title-slide .subtitle{font-size:13px;margin-bottom:20px}
  .title-slide .bullets li{font-size:13px}
  .schema-slide h2{font-size:20px;margin-bottom:16px}
  .schema-groups{gap:8px}
  .schema-group{min-width:120px;flex:1 1 44%;padding:10px 12px}
  .schema-group h3{font-size:11px}
  .schema-group .entity{font-size:11px}
  .intro-slide h2{font-size:20px}
  .intro-slide .intro-sub{font-size:13px;margin-bottom:18px}
  .intro-card{padding:14px 16px;margin-bottom:10px}
  .intro-card h3{font-size:14px}
  .intro-card p{font-size:12px}
  .intro-card .mini-table{font-size:11px}
  .intro-text{font-size:13px;line-height:1.65}
  .intro-highlight{font-size:12px;padding-left:12px}
  .intro-tree{font-size:9px;padding:10px 12px}
  .uc-slide .uc-header h2{font-size:17px}
  .uc-slide .step-info{font-size:11px}
  .uc-content{gap:10px}
  .uc-diagram{height:30vh;min-height:160px}
  .uc-narrative{font-size:12px;line-height:1.6}
  .uc-data{font-size:10px;padding:8px 10px}
  .data-entity-name{font-size:11px}
  .data-row .fn{min-width:80px;font-size:10px}
  .step-controls{gap:6px;padding:4px 0}
  .step-btn{padding:4px 10px;font-size:11px}
  .step-dot{width:6px;height:6px}
  .closing-slide h2{font-size:22px;margin-bottom:20px}
  .closing-card{padding:16px 18px}
  .closing-card h3{font-size:14px}
  .closing-card p{font-size:12px}
  .bottom-nav{gap:8px;padding:0 8px}
  .nav-btn{padding:6px 12px;font-size:12px}
  .slide-dot{width:8px;height:8px}
  .slide-dots{gap:5px}
  .restart-btn{padding:12px 28px;font-size:14px}
}
@media(max-width:480px){
  .schema-group{flex:1 1 100%}
  .closing-cards{gap:12px}
  .uc-diagram{height:26vh;min-height:140px}
  .tbl-box text{font-size:10px}
  .intro-slide{overflow-y:auto}
}
</style>
</head>

const SLIDES=[

{type:'uc',title:'UC1: Cash Deposit',
 viewBox:'0 0 720 340',
 tables:{
  Category:{x:30,y:30,w:155,h:46,label:'Category'},
  TransactionType:{x:30,y:140,w:188,h:46,label:'TransactionType'},
  Account:{x:530,y:140,w:155,h:46,label:'Account'},
  Transaction:{x:270,y:255,w:188,h:54,label:'Transaction'}
 },
 arrows:[
  {id:'cat-tt',from:'Category',to:'TransactionType',fs:'b',ts:'t'},
  {id:'tt-tx',from:'TransactionType',to:'Transaction',fs:'r',ts:'l'},
  {id:'tx-acc',from:'Transaction',to:'Account',fs:'r',ts:'b'}
 ],
 steps:[
  {title:'What is a Transaction?',
   narrative:'The <b>Transaction</b> table is the central ledger of LottoGest. Every financial event at a lottery house — a cash deposit, a bill payment, a credit card sale — becomes one row in this table. It records <em>what</em> happened, <em>when</em>, <em>how much</em>, and through which account.<br><br>Transactions are classified through a two-level hierarchy: <b>Category</b> (top-level) contains <b>TransactionType</b> (what the operator selects). <b>TransactionType is the single source of truth</b> — it is the only classification input from the operator. The system automatically sets <b>CategoryId</b> (= TransactionType.CategoryId) and <b>Direction</b> (= Category.DefaultDirection) as <em>denormalized fields</em>, never independently editable after creation.<br><br><b>TransactionType</b> also stores <b>SettlementRule</b> (how DueDate is calculated) and <b>RequiresTabAccountAndClient</b> (whether the transaction must use a Tab account and ClientId, used by the fiado Cliente types).<br><br>Each operator works at a terminal, which is modeled as an <b>Account</b>.',
   activeTables:['Category','TransactionType','Account'],
   activeArrows:[],
   data:[
    {entity:'Category',fields:[{n:'Name',v:'"Saídas"'},{n:'DefaultDirection',v:'"Out"',hl:'hl'}]},
    {entity:'TransactionType',fields:[{n:'Name',v:'"Depósito Dinheiro"'},{n:'CategoryId',v:'→ Saídas',hl:'hl'},{n:'SettlementRule',v:'NextCalendarDay'},{n:'RequiresTabAccountAndClient',v:'false'}]},
    {entity:'Account',fields:[{n:'Name',v:'"Jennifer"'},{n:'Type',v:'"Terminal"'}]}
   ]},
  {title:'Creating a Cash Deposit',
   narrative:'A customer brings <b>R$2,000</b> in cash to be deposited into their CEF bank account via the lotérica. The operator selects "Depósito Dinheiro" and enters the amount and time. The system creates a Transaction row: <b>Value is always positive</b> (R$2,000), <b>Direction=Out</b>, and TransactionTime records 10:30.<br><br><b style="color:var(--blue)">Why Out?</b> Although the cash physically enters the drawer, it is a <em>liability</em> — the lotérica owes that money to CEF at settlement. "Depósito Dinheiro" is seeded under <b>Saídas</b> to reflect this accounting reality. The cash drawer is reconciled via the <b>DailyClose</b> snapshot, not by overriding Direction on individual transactions.<br><br>For cash deposits, <b>DueDate = Date + 1 day</b>, because the seeded SettlementRule is NextCalendarDay.<br><br>Every transaction also tracks <b>authorship</b>: <b>RecordedByOperatorId</b> (which operator\'s context — their terminal) and <b>CreatedByUserId</b> (who actually created the record). Here Jennifer is at her own terminal — both fields point to her, the normal case when the operator is working their own shift. In UC3, we\'ll see what happens when someone <em>covers</em> for another operator.',
   activeTables:['Category','TransactionType','Transaction','Account'],
   activeArrows:['cat-tt','tt-tx','tx-acc'],
   data:[
    {entity:'Transaction',fields:[
     {n:'Date',v:'"2025-03-15"'},{n:'Value',v:'"R$ 2,000.00"',hl:'hl'},
     {n:'Direction',v:'"Out"',hl:'hl'},{n:'TransactionTime',v:'"10:30"'},
     {n:'CategoryId',v:'→ Saídas'},{n:'TransactionTypeId',v:'→ Depósito Dinheiro'},
     {n:'AccountId',v:'→ Jennifer'},{n:'DueDate',v:'"2025-03-16"'},
     {n:'PaidAt',v:'null'},{n:'RecordedByOperatorId',v:'→ Jennifer'},{n:'CreatedByUserId',v:'→ Jennifer'},
     {n:'Status',v:'"Active"'}
    ]}
   ]},
  {title:'The Three-Date Model',
   narrative:'Every transaction has <b>three dates</b> tracking its lifecycle:<br><br>• <span style="color:#4caf50"><b>Date</b></span> — when the financial event occurred (March 15)<br>• <span style="color:#4a9eff"><b>DueDate</b></span> — when payment is expected to settle with CEF (March 16, next calendar day)<br>• <span style="color:#ef5350"><b>PaidAt</b></span> — when settlement actually occurred (null — CEF hasn\'t settled yet)<br><br>This enables <b>receivables/payables tracking</b>: the owner can query "how much is expected to settle this week" by filtering DueDate range with PaidAt IS NULL.',
   activeTables:['Transaction'],
   activeArrows:[],
   data:[
    {entity:'Transaction',fields:[
     {n:'Date',v:'"2025-03-15"',hl:'hl-green'},{n:'Value',v:'"R$ 2,000.00"'},
     {n:'Direction',v:'"Out"'},{n:'TransactionTime',v:'"10:30"'},
     {n:'DueDate',v:'"2025-03-16"',hl:'hl-blue'},
     {n:'PaidAt',v:'null',hl:'hl-red'},
     {n:'Status',v:'"Active"'}
    ]}
   ]}
 ]
},
{type:'uc',title:'UC2: PIX Payment Out',
 viewBox:'0 0 720 340',
 tables:{
  Category:{x:30,y:30,w:155,h:46,label:'Category'},
  TransactionType:{x:30,y:140,w:188,h:46,label:'TransactionType'},
  Account:{x:530,y:140,w:155,h:46,label:'Account'},
  Transaction:{x:270,y:255,w:188,h:54,label:'Transaction'}
 },
 arrows:[
  {id:'cat-tt',from:'Category',to:'TransactionType',fs:'b',ts:'t'},
  {id:'tt-tx',from:'TransactionType',to:'Transaction',fs:'r',ts:'l'},
  {id:'tx-acc',from:'Transaction',to:'Account',fs:'r',ts:'b'}
 ],
 steps:[
  {title:'Direction and Categories',
   narrative:'The system tracks money flow with a <b>Direction</b> enum: <b>In</b> (money enters) and <b>Out</b> (money leaves). Each Category has a <b>DefaultDirection</b>. "Entradas" defaults to In, "Saídas" defaults to Out.<br><br>Direction on a Transaction is <b>denormalized</b> — it is automatically derived from the Category\'s DefaultDirection when the operator selects a TransactionType. The operator never chooses Direction directly. PIX falls under "Saídas", so any PIX transaction is automatically Direction=Out.',
   activeTables:['Category','TransactionType'],
   activeArrows:['cat-tt'],
   data:[
    {entity:'Category',fields:[{n:'Name',v:'"Saídas"'},{n:'DefaultDirection',v:'"Out"',hl:'hl'}]},
    {entity:'TransactionType',fields:[{n:'Name',v:'"PIX"'},{n:'CategoryId',v:'→ Saídas',hl:'hl'},{n:'SettlementRule',v:'SameDay'},{n:'RequiresTabAccountAndClient',v:'false'}]}

 steps:[
  {title:'Multi-Tenancy: User + Branch',
   narrative:'LottoGest is a <b>SaaS platform</b>. <b>Branch</b> is the tenant — one per lottery house. <b>User</b> is global (authentication only). <b>BranchUser</b> is the junction that gives a User a specific Role within a Branch.<br><br>A single User can belong to multiple Branches (e.g., an owner managing 2 lottery houses). <b>Roles:</b> Admin (full access), Manager (approve closings, cancel old transactions), Member (operator, own terminal only).<br><br>Here we have two Users: <b>Jennifer</b> (Member — the day-to-day operator) and <b>Maria</b> (Manager — approves closings and can cover shifts).',
   activeTables:['User','BranchUser','Branch'],
   activeArrows:['user-bu','bu-branch'],
   data:[
    {entity:'User (operator)',fields:[{n:'Name',v:'"Jennifer"'},{n:'Email',v:'"jennifer@mail.com"'}]},
    {entity:'User (manager)',fields:[{n:'Name',v:'"Maria"'},{n:'Email',v:'"maria@mail.com"'}]},
    {entity:'Branch',fields:[{n:'Name',v:'"Lotérica Centro"'},{n:'Cnpj',v:'"12.345.678/0001-90"'}]},
    {entity:'BranchUser',fields:[{n:'UserId',v:'→ Jennifer'},{n:'BranchId',v:'→ Lotérica Centro'},{n:'Role',v:'"Member"',hl:'hl'}]},
    {entity:'BranchUser',fields:[{n:'UserId',v:'→ Maria'},{n:'BranchId',v:'→ Lotérica Centro'},{n:'Role',v:'"Manager"',hl:'hl'}]}
   ]},
  {title:'Operator: Why Separate from User?',
   narrative:'<b>Operator</b> is the employee concept within a Branch. It is linked to a User for login, but exists <em>independently</em>.<br><br><b>Why?</b> Historical integrity: if an employee leaves and their User is deactivated, the Operator record (and all transactions, time entries, daily closings) remains intact. An Operator can also exist <em>without</em> a login — a former employee, or a new hire not yet set up.<br><br><b style="color:var(--accent)">Today\'s scenario:</b> Jennifer is <b>off today</b>. Maria (Manager) logs in and covers Jennifer\'s terminal. This is exactly why User, Operator, and Account are separate — on transactions, <b>RecordedByOperatorId</b> stays <b>Jennifer</b> (the terminal context), but <b>CreatedByUserId</b> is <b>Maria</b> (the person actually logged in). The system preserves full authorship even when someone covers for another.<br><br><b style="color:var(--blue)">Design note:</b> Operator links directly to User (optional FK), <em>not</em> to BranchUser. This is intentional — the link must survive BranchUser deactivation. Each User can have at most one active linked Operator per Branch, enforced by a filtered unique index on (BranchId, UserId) where UserId is not null and Active is true. Updating an Operator with UserId null clears only the login link; the Operator row remains active for history, reporting, and account assignments. Branch consistency is enforced at the <b>API/service layer</b>.',
   activeTables:['Operator','Branch','User'],
   activeArrows:['op-branch','op-user'],
   data:[
    {entity:'Operator',fields:[{n:'Name',v:'"Jennifer"'},{n:'BranchId',v:'→ Lotérica Centro'},{n:'UserId',v:'→ Jennifer (User)',hl:'hl'}]},
    {entity:'Covering scenario',fields:[{n:'RecordedByOperatorId',v:'→ Jennifer',hl:'hl'},{n:'CreatedByUserId',v:'→ Maria',hl:'hl-blue'}]}
   ]},
  {title:'Accounts and the Terminal/Tab Pair',
   narrative:'<b>Account</b> is purely financial — it represents a terminal drawer, a bank account, or a tab (credit) account. In branches that use fiado, a Terminal account may have a paired <b>Tab Account</b> via the self-referencing <b>TabAccountId</b>. A terminal may also exist without a Tab account when that branch does not use fiado.<br><br>This separation is critical: credit sales (<em>fiado</em>) go to the Tab account, not the terminal, so they don\'t distort the daily cash reconciliation. <b>OperatorAccount</b> is the junction linking Operators to their Accounts. IsPrimary=true marks the main terminal — <b>at most one per operator</b> (unique filtered index).<br><br>When Maria covers Jennifer\'s shift, she operates this same terminal and tab pair — the <b>Account stays the same</b>, only the <b>CreatedByUserId</b> on transactions changes to Maria.<br><br><b style="color:var(--blue)">TabAccountId invariants:</b> only <b>Terminal</b> accounts may set it, the target must be of type <b>Tab</b>, a Terminal may exist without a Tab, and each Tab is paired with <b>at most one</b> Terminal.',
   activeTables:['AccountTerminal','AccountTab','OperatorAccount','Operator'],
   activeArrows:['oa-op','oa-acc','acc-tab'],
   data:[
    {entity:'Account (Terminal)',fields:[{n:'Name',v:'"Jennifer"'},{n:'Type',v:'"Terminal"'},{n:'TabAccountId',v:'→ Tab Jennifer',hl:'hl'}]},
    {entity:'Account (Tab)',fields:[{n:'Name',v:'"Tab Jennifer"'},{n:'Type',v:'"Tab"'},{n:'TabAccountId',v:'null'}]},
    {entity:'OperatorAccount',fields:[{n:'OperatorId',v:'→ Jennifer'},{n:'AccountId',v:'→ Jennifer'},{n:'IsPrimary',v:'"true"',hl:'hl'}]}
   ]}
 ]

 steps:[
  {title:'Pre-dated Cheques in Brazil',
   narrative:'In Brazilian commerce, <b>pre-dated cheques</b> are common. A customer writes a cheque with a future date — the business holds it and deposits it on that date.<br><br>When a cheque is split into installments, LottoGest creates <b>N separate Transaction rows</b>, one per installment. This is extracted from the original Access VBA logic (FrmLancamentoCheque). Credit card installments work differently — they store one Transaction with description "Parcelado 3x". Only cheques create multiple rows.',
   activeTables:['Account','Client','TransactionType'],
   activeArrows:['cat-tt'],
   data:[
    {entity:'Client',fields:[{n:'Name',v:'"Carlos"'}]},
    {entity:'TransactionType',fields:[{n:'Name',v:'"Depósito Cheque"'},{n:'SettlementRule',v:'OperatorEnteredCheque'},{n:'RequiresTabAccountAndClient',v:'false'}]}
   ]},
  {title:'System Creates 3 Installments',
   narrative:'<b>R$3,000 cheque in 3 installments:</b> the system creates 3 Transaction rows. <b>Manual rows are the default</b> — the operator supplies each installment\'s Value and DueDate, and the request total must equal the exact sum (rules out fat-finger splits). <b>Auto-generation is optional</b>: the operator sets <code>AutoGenerateInstallments = true</code>, an installment count, and a base DueDate; the server splits equally with the residual on the last row, staggers monthly from the base date, and moves weekend or branch holiday dates to the next business day.<br><br>Row descriptions follow <code>CH PRE ({i}/{N}) - {Description}</code> when the operator supplies a description; otherwise just <code>CH PRE ({i}/{N})</code> with no trailing separator. <b>All installments share the same OriginTransactionId, including the first</b> (which points to itself). This simplifies group lookups: <code>WHERE OriginTransactionId = @groupId</code> returns all members.',
   activeTables:['Tx1','Tx2','Tx3','Account'],
   activeArrows:['tx1-acc','tx2-acc','tx3-acc'],
   data:[

    {entity:'Transaction #2',fields:[{n:'Id',v:'"tx-002"'},{n:'Value',v:'"R$ 1,000.00"'},{n:'Description',v:'"CH PRE (2/3)"'},{n:'DueDate',v:'"2025-06-15"'},{n:'OriginTransactionId',v:'→ tx-001',hl:'hl'},{n:'RecordedByOperatorId',v:'→ Jennifer'},{n:'CreatedByUserId',v:'→ Maria'}]},
    {entity:'Transaction #3',fields:[{n:'Id',v:'"tx-003"'},{n:'Value',v:'"R$ 1,000.00"'},{n:'Description',v:'"CH PRE (3/3)"'},{n:'DueDate',v:'"2025-07-15"'},{n:'OriginTransactionId',v:'→ tx-001',hl:'hl'},{n:'RecordedByOperatorId',v:'→ Jennifer'},{n:'CreatedByUserId',v:'→ Maria'}]}
   ]},
  {title:'Receivables Tracking',
   narrative:'The three-date model shines here: each installment has a <b>different DueDate</b>. The owner can query "what cheques are due this month?" by filtering DueDate range with PaidAt IS NULL.<br><br>When the first cheque clears (deposited at CEF), <b>PaidAt is set</b>. The other two remain as receivables — money expected in the future.',
   activeTables:['Tx1','Tx2','Tx3'],

 steps:[
  {title:'What is Fiado?',
   narrative:'Regular customers at a lottery house can buy on credit — <b>"fiado"</b> in Portuguese. This is extremely common in small Brazilian businesses.<br><br>The key design challenge: credit sales should <b>NOT</b> affect the cash drawer count. If Jennifer sells R$150 on credit, her drawer is unchanged — she didn\'t receive cash. But the business needs to track that R$150 is owed.<br><br><b>Solution:</b> branches that use fiado pair a Terminal account with a <b>Tab account</b> (AccountType=Tab). Credit transactions go to the Tab, not the Terminal. This is the <b>TabAccountId</b> self-referencing FK on Account.',
   activeTables:['AccountTerminal','AccountTab','Client','Operator'],
   activeArrows:['acc-tab'],
   data:[
    {entity:'Account (Terminal)',fields:[{n:'Name',v:'"Jennifer"'},{n:'Type',v:'"Terminal"'},{n:'TabAccountId',v:'→ Tab Jennifer',hl:'hl'}]},
    {entity:'Account (Tab)',fields:[{n:'Name',v:'"Tab Jennifer"'},{n:'Type',v:'"Tab"'}]},
    {entity:'Client',fields:[{n:'Name',v:'"João"'}]}
   ]},
  {title:'Credit Sale (Money Out on Tab)',
   narrative:'Client João buys <b>R$150</b> of lottery tickets on credit. The operator selects TransactionType <b>"Cliente"</b> under Category <b>"Saídas"</b>.<br><br>The Fiado in/out distinction is handled by <b>two separate TransactionTypes</b>: "Cliente" under "Saídas" = Out (credit sale), "Cliente" under "Entradas" = In (payment). Both set <b>RequiresTabAccountAndClient = true</b>, so the branch-consistency layer requires a Tab account and ClientId. Direction is never overridden — it is always derived from the Category\'s DefaultDirection. The Transaction has <b>Direction=Out</b> on the <b>Tab account</b> (not the Terminal!), with ClientId set to João.',
   activeTables:['Category','TransactionType','Transaction','AccountTab','Client'],
   activeArrows:['cat-tt','tt-tx','tx-tab','client-tx'],
   data:[
    {entity:'TransactionType',fields:[{n:'Name',v:'"Cliente"'},{n:'CategoryId',v:'→ Saídas'},{n:'SettlementRule',v:'SameDay'},{n:'RequiresTabAccountAndClient',v:'true',hl:'hl'}]},
    {entity:'Transaction',fields:[
     {n:'Value',v:'"R$ 150.00"'},{n:'Direction',v:'"Out"',hl:'hl'},
     {n:'AccountId',v:'→ Tab Jennifer',hl:'hl'},{n:'ClientId',v:'→ João'},
     {n:'CategoryId',v:'→ Saídas'},{n:'TransactionTypeId',v:'→ Cliente'},
     {n:'RecordedByOperatorId',v:'→ Jennifer'},{n:'CreatedByUserId',v:'→ Maria'}
    ]}
   ]},
  {title:'Tab Balance = R$150',
   narrative:'Outstanding credit = <b>SUM(Out) − SUM(In)</b> on the Tab account, where Status = Active. Right now there\'s one Out transaction of R$150, so the balance is <b>R$150</b> — João owes R$150.<br><br>The owner can query this grouped by Client for an <b>aging report</b>: "show me all customers who owe money, sorted by oldest debt."<br><br><b style="color:var(--blue)">Important:</b> The Fiado balance is <b>always calculated at query time</b> from Tab account transactions — it is NOT persisted as a DailyClose product. The daily close form may display it for reference, but does not store it as a snapshot value.',
   activeTables:['AccountTab'],
   activeArrows:[],
   badge:{table:'AccountTab',text:'R$ 150'},
   data:[
    {entity:'Balance Query',sql:true,text:'<span class="kw">SELECT</span>\n  <span class="kw">SUM</span>(<span class="kw">CASE WHEN</span> Direction=Out\n      <span class="kw">THEN</span> Value <span class="kw">ELSE</span> 0 <span class="kw">END</span>)\n  - <span class="kw">SUM</span>(<span class="kw">CASE WHEN</span> Direction=In\n      <span class="kw">THEN</span> Value <span class="kw">ELSE</span> 0 <span class="kw">END</span>)\n  <span class="kw">AS</span> Balance\n<span class="kw">FROM</span> Transaction\n<span class="kw">WHERE</span> AccountId = \'Tab Jennifer\'\n\n→ <span class="res">R$ 150.00</span>'}
   ]},
  {title:'Client Pays Back',
   narrative:'João returns and pays his R$150 debt. The operator selects TransactionType <b>"Cliente"</b> under Category <b>"Entradas"</b> (Direction=In).<br><br>Same type name ("Cliente"), different category — this is <b>intentional design</b> from the original Access system. This row also requires a Tab account and ClientId, and the Transaction has <b>Direction=In</b> on the Tab account.',
   activeTables:['Category','TransactionType','Transaction','AccountTab','Client'],
   activeArrows:['cat-tt','tt-tx','tx-tab','client-tx'],
   data:[
    {entity:'TransactionType',fields:[{n:'Name',v:'"Cliente"'},{n:'CategoryId',v:'→ Entradas',hl:'hl-green'},{n:'SettlementRule',v:'SameDay'},{n:'RequiresTabAccountAndClient',v:'true',hl:'hl'}]},
    {entity:'Transaction (Payment)',fields:[
     {n:'Value',v:'"R$ 150.00"'},{n:'Direction',v:'"In"',hl:'hl-green'},
     {n:'AccountId',v:'→ Tab Jennifer'},{n:'ClientId',v:'→ João'},

    ]}
   ]},
  {title:'Balance Zeroed — Drawer Untouched',
   narrative:'Balance recalculated: R$150 (Out) − R$150 (In) = <b style="color:var(--accent)">R$ 0</b>. The debt is cleared.<br><br>Throughout this entire flow, the Terminal account "Jennifer" was <b>never touched</b> — the cash drawer reconciliation stays clean. This is why the Terminal/Tab separation exists: it <b>isolates credit from cash</b>, ensuring the CashVariance calculation at end of day is accurate.',

let currentSlide=0;
let stepPerSlide={};
let autoPlayTimer=null;
let autoPlaying=false;

function init(){
  const track=document.getElementById('track');
  track.innerHTML=SLIDES.map((s,i)=>renderSlide(s,i)).join('');
  renderDots();
  SLIDES.forEach((_,i)=>{stepPerSlide[i]=0});
  initAllArrows();
  SLIDES.forEach((s,i)=>{if(s.type==='uc')updateStep(i,0)});
  document.addEventListener('keydown',onKey);
  updateDots();
}

function renderSlide(s,i){
  switch(s.type){
    case 'title':return renderTitle(i);
    case 'schema':return renderSchema(i);
    case 'intro':return renderIntro(s,i);
    case 'uc':return renderUC(s,i);
    case 'closing':return renderClosing(i);
  }
}

function renderTitle(i){
  return `<div class="slide title-slide" data-idx="${i}">
    <h1>LottoGest Backend Architecture</h1>
    <p class="subtitle">A lottery house cash management SaaS — digitizing daily operations from paper + Microsoft Access</p>
    <ul class="bullets">
      <li>.NET + EF Core + PostgreSQL</li>
      <li>18 entities, multi-tenant (Branch = tenant)</li>
      <li>Transaction ledger + Daily closing snapshot</li>
    </ul>
  </div>`;
}

function renderSchema(i){
  const groups=[
    {name:'Auth',color:'var(--blue)',entities:['User','RefreshToken','BranchUser','Branch']},
    {name:'Employee',color:'var(--green)',entities:['Operator','OperatorAccount','Account']},
    {name:'Financial',color:'var(--amber)',entities:['Category','TransactionType','Transaction','Client']},
    {name:'Closing',color:'var(--purple)',entities:['DailyClose','DailyCloseItem','Product']},
    {name:'HR',color:'var(--teal)',entities:['TimeEntry','Holiday','Setting']}
  ];
  const gs=groups.map(g=>{
    const ents=g.entities.map(e=>`<div class="entity" style="border-left-color:${g.color}">${e}</div>`).join('');
    return `<div class="schema-group"><h3 style="border-bottom-color:${g.color};color:${g.color}">${g.name}</h3>${ents}</div>`;
  }).join('');
  return `<div class="slide schema-slide" data-idx="${i}">
    <h2>Schema Overview — 18 Entities</h2>
    <div class="schema-groups">${gs}</div>
  </div>`;
}

function renderIntro(s,i){

        <div class="intro-card">
          <h3 class="teal-color">The Owner's View</h3>
          <p>The owner needs to answer daily: <em>"Is the money in the drawer matching what the system says?"</em> The answer is the <b>CashVariance</b> (Diferença de Caixa) — the single most important number in the system. A negative variance means money is missing. A positive variance means extra money appeared. Both need investigation.</p>

    {t:'Branch Consistency',d:'Every FK on Transaction and DailyClose (Account, Operator, Client, TransactionType→Category) must resolve to the same BranchId — enforced at the service layer to prevent cross-tenant data leakage.'},
    {t:'Transaction Scope',d:'Members read by linked account, can filter their own rows with Mine, and can update, finalize, or cancel only linked-account rows they recorded on the same local business day. Draft finalization promotes Status to Active. Cancellation is terminal: Status moves to Cancelled with a required reason, the cancellation audit fields and the generic update audit fields are stamped from the same clock instant, and installment siblings are not touched.'},

    {t:'TimeEntry Calculation',d:'Clock pairs live on child TimeEntrySegment rows (full DateTime, branch-local wall clock); the parent TimeEntry holds Date, Status, and computed totals. Two shapes: Members send Action: Open|Close (server-stamped DateTime); Managers/Admins send an explicit Segments list. A prior-day open segment is overnight if the next tap is Close on that prior-day row, or forgotten (contributes 0h) if the next tap is Open on today\\'s row. Gross hours = sum of closed segment durations + live contribution of any open segment (same day). Lunch top-up rule: effective_lunch = max(0, lunch_tier(grossHours) − total_gap), where total_gap counts every gap between consecutive segment pairs. Non-Present statuses return TotalHours = DailyTarget (abonado) or 0 (owing). At most one open segment per TimeEntry is enforced by the IX_TimeEntrySegments_TimeEntryId_OpenShift filtered unique index.'}

      <rect class="badge-bg" x="${t.x+t.w-60}" y="${t.y+t.h-6}" width="56" height="18" style="display:none" data-badge-bg="${k}"/>

  const totalSteps=s.steps.length;

      <div class="step-dots">${stepDots}</div>
      <button class="step-btn" onclick="changeStep(${idx},1)">Next Step &#9654;</button>
      <button class="step-btn play-btn" data-play="${idx}" onclick="toggleAutoPlay(${idx})">&#9654;&#124;</button>
    </div>
  </div>`;
}

function edgePt(tbl,side){
  switch(side){
    case 't':return[tbl.x+tbl.w/2,tbl.y];
    case 'b':return[tbl.x+tbl.w/2,tbl.y+tbl.h];
    case 'l':return[tbl.x,tbl.y+tbl.h/2];
    case 'r':return[tbl.x+tbl.w,tbl.y+tbl.h/2];
  }
}

function arrowD(tbls,fromK,toK,fs,ts){
  const f=edgePt(tbls[fromK],fs);
  const t=edgePt(tbls[toK],ts);
  const d=40;
  const off={t:[0,-d],b:[0,d],l:[-d,0],r:[d,0]};
  const c1=[f[0]+off[fs][0],f[1]+off[fs][1]];
  const c2=[t[0]+off[ts][0],t[1]+off[ts][1]];
  return `M${f[0]},${f[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${t[0]},${t[1]}`;
}

function initAllArrows(){
  document.querySelectorAll('.arrow-path').forEach(p=>{
    const len=p.getTotalLength();
    p.style.strokeDasharray=len;
    p.style.strokeDashoffset=len;
    p.dataset.len=len;
  });
}

function updateStep(slideIdx,stepIdx){
  const s=SLIDES[slideIdx];
  if(s.type!=='uc')return;
  const step=s.steps[stepIdx];
  stepPerSlide[slideIdx]=stepIdx;

  const slide=document.querySelector(`.slide[data-idx="${slideIdx}"]`);
  if(!slide)return;

  const curStepEl=slide.querySelector(`[data-curStep="${slideIdx}"]`);
  const stepTitleEl=slide.querySelector(`[data-stepTitle="${slideIdx}"]`);
  if(curStepEl)curStepEl.textContent=stepIdx+1;
  if(stepTitleEl)stepTitleEl.textContent=step.title;

  slide.querySelectorAll('.step-dot').forEach((d,j)=>{
    d.classList.toggle('active',j===stepIdx);
  });

  Object.keys(s.tables).forEach(k=>{
    const g=slide.querySelector(`[data-tbl="${k}"]`);
    if(!g)return;
    const isActive=step.activeTables.includes(k);
    g.classList.toggle('active',isActive);
    g.classList.toggle('dimmed',!isActive);

    const badge=g.querySelector(`[data-badge="${k}"]`);
    const badgeBg=g.querySelector(`[data-badge-bg="${k}"]`);
    let badgeText=null;
    if(step.badge&&step.badge.table===k)badgeText=step.badge.text;
    if(step.badgeB&&step.badgeB.table===k)badgeText=step.badgeB.text;
    if(badge&&badgeBg){
      if(badgeText){
        badge.textContent=badgeText;
        badge.style.display='';
        badgeBg.style.display='';
      }else{
        badge.style.display='none';
        badgeBg.style.display='none';
      }
    }
  });

  s.arrows.forEach(a=>{
    const path=slide.querySelector(`[data-arrow="${a.id}"]`);
    if(!path)return;
    const isActive=step.activeArrows.includes(a.id);
    const wasHidden=path.classList.contains('hidden');

    if(isActive){
      path.classList.remove('hidden','dimmed');
      path.classList.add('active');
      if(wasHidden||path.style.strokeDashoffset!=='0'){
        const len=path.dataset.len;
        path.style.transition='none';
        path.style.strokeDashoffset=len;
        path.getBoundingClientRect();
        const delay=step.staggerDelay?step.activeArrows.indexOf(a.id)*0.15:0;
        path.style.transition=`stroke-dashoffset .8s ease ${delay}s, stroke .3s, opacity .3s`;
        path.style.strokeDashoffset='0';
      }
    }else if(step.activeArrows.length>0){
      path.classList.remove('active','hidden');
      path.classList.add('dimmed');
      path.style.transition='stroke-dashoffset .4s, stroke .3s, opacity .3s';
      path.style.strokeDashoffset='0';
    }else{
      path.classList.remove('active','dimmed');
      path.classList.add('hidden');
      path.style.strokeDashoffset=path.dataset.len;
    }
  });

  const narrativeEl=slide.querySelector(`[data-narrative="${slideIdx}"]`);
  const dataEl=slide.querySelector(`[data-data="${slideIdx}"]`);

  if(narrativeEl){
    narrativeEl.style.opacity=0;
    setTimeout(()=>{
      narrativeEl.innerHTML=step.narrative;
      narrativeEl.style.opacity=1;
    },150);
  }

  if(dataEl){
    dataEl.style.opacity=0;
    setTimeout(()=>{
      dataEl.innerHTML=renderDataPanel(step.data);
      dataEl.style.opacity=1;
    },150);
  }
}

function renderDataPanel(data){
  if(!data||!data.length)return'';
  return data.map(d=>{
    if(d.sql){
      return `<div class="data-entry"><div class="data-entity-name">${d.entity}</div><div class="data-sql">${d.text}</div></div>`;
    }
    const fields=d.fields.map(f=>{
      const cls=f.hl?` ${f.hl}`:'';
      return `<div class="data-row"><span class="fn">${f.n}</span><span class="fv${cls}">${f.v}</span></div>`;
    }).join('');
    return `<div class="data-entry"><div class="data-entity-name">${d.entity}</div>${fields}</div>`;
  }).join('');
}

function renderDots(){
  const dotsEl=document.getElementById('slideDots');
  dotsEl.innerHTML=SLIDES.map((_,i)=>`<div class="slide-dot${i===0?' active':''}" onclick="goToSlide(${i})"></div>`).join('');
}

function updateDots(){
  document.querySelectorAll('#slideDots .slide-dot').forEach((d,i)=>{
    d.classList.toggle('active',i===currentSlide);
  });
}

function goToSlide(idx){
  if(idx<0||idx>=SLIDES.length)return;
  currentSlide=idx;
  document.getElementById('track').style.transform=`translateX(-${idx*100}vw)`;
  updateDots();
  updateNavBtns();
  stopAutoPlay();
}

function updateNavBtns(){
  document.getElementById('prevBtn').classList.toggle('faded',currentSlide===0);
  document.getElementById('nextBtn').classList.toggle('faded',currentSlide===SLIDES.length-1);
}

function changeSlide(dir){
  goToSlide(currentSlide+dir);
}

function changeStep(slideIdx,dir){
  const s=SLIDES[slideIdx];
  if(s.type!=='uc')return;
  const cur=stepPerSlide[slideIdx]||0;
  const next=cur+dir;
  if(next<0||next>=s.steps.length)return;
  updateStep(slideIdx,next);
  if(autoPlaying)restartAutoPlayTimer(slideIdx);
}

function toggleAutoPlay(slideIdx){
  if(autoPlaying){
    stopAutoPlay();
  }else{
    autoPlaying=true;
    const btn=document.querySelector(`[data-play="${slideIdx}"]`);
    if(btn)btn.classList.add('playing');
    restartAutoPlayTimer(slideIdx);
  }
}

function restartAutoPlayTimer(slideIdx){
  clearInterval(autoPlayTimer);
  autoPlayTimer=setInterval(()=>{
    const s=SLIDES[slideIdx];
    if(s.type!=='uc')return stopAutoPlay();
    const cur=stepPerSlide[slideIdx]||0;
    const next=cur+1;
    if(next>=s.steps.length){
      updateStep(slideIdx,0);
    }else{
      updateStep(slideIdx,next);
    }
  },4000);
}

function stopAutoPlay(){
  autoPlaying=false;
  clearInterval(autoPlayTimer);
  document.querySelectorAll('.play-btn').forEach(b=>b.classList.remove('playing'));
}

function onKey(e){
  if(e.key==='ArrowRight')changeSlide(1);
  else if(e.key==='ArrowLeft')changeSlide(-1);
  else if(e.key==='ArrowDown'){
    e.preventDefault();
    changeStep(currentSlide,1);
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    changeStep(currentSlide,-1);
  }
}

// Touch swipe navigation
let touchStartX=0,touchStartY=0,touchStartTime=0;
document.addEventListener('touchstart',function(e){
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  touchStartTime=Date.now();
},{passive:true});
document.addEventListener('touchend',function(e){
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const dt=Date.now()-touchStartTime;
  if(dt>500)return;
  if(Math.abs(dx)<50)return;
  if(Math.abs(dy)>Math.abs(dx)*0.7)return;
  if(dx<0)changeSlide(1);
  else changeSlide(-1);
},{passive:true});

init();
</script>
</body>
</html>
